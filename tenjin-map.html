<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #map { width: 100%; height: 100%; }
.shop-label {
  background: white; border-radius: 6px; padding: 2px 6px;
  font-size: 10px; font-weight: 700; white-space: nowrap;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2); border: 2px solid;
  cursor: pointer; line-height: 1.5;
}
</style>
</head>
<body>
<div id="map"></div>
<script>
const SHOPS = [
  {name:'HUMAN MADE',color:'#3060d0',lat:33.58835,lng:130.39508},
  {name:'Supreme',color:'#3060d0',lat:33.58729,lng:130.39659},
  {name:'#FR2',color:'#3060d0',lat:33.58652,lng:130.39704},
  {name:'nanamica',color:'#3060d0',lat:33.58841,lng:130.39491},
  {name:'Hysteric Glamour',color:'#3060d0',lat:33.58711,lng:130.39555},
  {name:'THE CAP',color:'#3060d0',lat:33.58677,lng:130.39490},
  {name:'MOMOTARO JEANS',color:'#3060d0',lat:33.58532,lng:130.39228},
  {name:'ZARA',color:'#3060d0',lat:33.58831,lng:130.39649},
  {name:'adam et ropé',color:'#3060d0',lat:33.59074,lng:130.39867},
  {name:'Nike',color:'#e04010',lat:33.59074,lng:130.39997},
  {name:'adidas Originals',color:'#e04010',lat:33.58765,lng:130.39764},
  {name:'PUMA',color:'#e04010',lat:33.58506,lng:130.39458},
  {name:'CONVERSE',color:'#e04010',lat:33.58487,lng:130.39441},
  {name:'Flamingo',color:'#8a4a20',lat:33.58645,lng:130.39517},
  {name:'JAM VINTAGE',color:'#8a4a20',lat:33.58997,lng:130.39387},
  {name:'MANDARAKE',color:'#8a4a20',lat:33.59017,lng:130.39373},
  {name:'天神 PARCO',color:'#8020a0',lat:33.59054,lng:130.39929},
  {name:'ONE FUKUOKA',color:'#8020a0',lat:33.59090,lng:130.40010},
  {name:'Mina 天神',color:'#8020a0',lat:33.58883,lng:130.39784},
  {name:'大丸',color:'#8020a0',lat:33.59005,lng:130.40018},
  {name:'岩田屋三越',color:'#8020a0',lat:33.58920,lng:130.39920},
  {name:'Apple',color:'#208060',lat:33.58793,lng:130.39702},
  {name:'CAITAC SQUARE',color:'#208060',lat:33.58522,lng:130.39443},
  {name:'Flying Tiger',color:'#208060',lat:33.58501,lng:130.39469},
  {name:'新天町',color:'#208060',lat:33.59022,lng:130.39783},
];

const map = L.map('map', {zoomControl:true}).setView([33.5878,130.3965],15);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'© OpenStreetMap © CARTO', maxZoom:19
}).addTo(map);

SHOPS.forEach(s => {
  const icon = L.divIcon({
    className:'',
    html:`<div class="shop-label" style="border-color:${s.color};color:${s.color};">${s.name}</div>`,
    iconAnchor:[0,0]
  });
  L.marker([s.lat,s.lng],{icon}).addTo(map);
});

// 接收外部 postMessage 飛到指定位置
window.addEventListener('message', function(e) {
  if (e.data && e.data.lat && e.data.lng) {
    map.flyTo([e.data.lat, e.data.lng], 17, {duration: 0.8});
  }
});
</script>
</body>
</html>
